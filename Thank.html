<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <style>
        body, html { margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; background: #18181b; color: #f3f4f6; height: 100vh; overflow: hidden; }
        .content { text-align: center; padding-top: 20%; z-index: 1; position: relative; }
        .thank-you-message { font-size: 3rem; font-weight: bold; color: #6366f1; text-shadow: 0 4px 8px rgba(0,0,0,0.6); }
        .thank-you-message:hover { transform: scale(1.1); transition: 0.3s; }
        .parallax-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; }
        .parallax-layer { position: absolute; width: 150%; height: 150%; top: -25%; left: -25%; background-repeat: no-repeat; background-size: cover; animation: float 20s infinite alternate; }
        .layer-1 { background: radial-gradient(circle, #1f2637 0%, transparent 70%); opacity: 0.2; transform: translateZ(-2px) scale(1.5); }
        .layer-2 { background: radial-gradient(circle, #2a2f4a 0%, transparent 60%); opacity: 0.15; transform: translateZ(-4px) scale(2); }
        .layer-3 { background: radial-gradient(circle, #6366f1 0%, transparent 40%); opacity: 0.1; transform: translateZ(-6px) scale(2.5); }
        @keyframes float { 0% { transform: translateY(0); } 100% { transform: translateY(20px); } }
    </style>
</head>
<body>
    <div class="parallax-bg">
        <div class="parallax-layer layer-1"></div>
        <div class="parallax-layer layer-2"></div>
        <div class="parallax-layer layer-3"></div>
    </div>

    <div class="content">
        <div class="thank-you-message">Thank You for Reaching Out!</div>
    </div>

    <script>
        document.addEventListener('mousemove', (e) => {
            document.querySelectorAll('.parallax-layer').forEach((layer, i) => {
                layer.style.transform = `translateX(${(window.innerWidth - e.pageX * (i + 1) * 10) / 100}px) translateY(${(window.innerHeight - e.pageY * (i + 1) * 10) / 100}px)`;
            });
        });

        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/tsparticles@3';
        document.body.appendChild(script);

        script.onload = () => {
            tsParticles.load("particles-js", {
                fullScreen: { enable: true, zIndex: -1 },
                background: { color: "#18181b" },
                particles: { number: { value: 80 }, color: { value: "#6366f1" }, size: { value: 3 }, move: { speed: 0.6 } }
            });
        };
    </script>
</body>
</html>
